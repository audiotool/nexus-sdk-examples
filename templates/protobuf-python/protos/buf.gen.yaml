version: v2
clean: false # avoid removing existing files
plugins:
  # python code generators - we need 3 in the case of python,
  # other languages may differ. https://buf.build/plugins/protobuf
  - remote: buf.build/protocolbuffers/python:v33.4
    out: ../src/
  - remote: buf.build/connectrpc/python:v0.7.1
    out: ../src/
  - remote: buf.build/protocolbuffers/pyi:v33.4
    out: ../src/
